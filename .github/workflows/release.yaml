name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package Home Assistant integration
        run: |
          cd custom_components/dynamic_drag_drop_dashboard
          zip -r ../../dynamic_drag_drop_dashboard.zip . -x '*.pyc' '__pycache__/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: dynamic_drag_drop_dashboard.zip
          generate_release_notes: true
